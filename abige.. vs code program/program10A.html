<html>

<head>

<meta charset="utf-8">

<title>NewHTML5InputTypes</title>

</head>

<body>

<h1>New HTML5 Input Types Demo</h1>

<p>
This form demonstrates the new HTML5 input types and the
placeholder, required and autofocus attributes.
</p>

<form method="post" action="http://www.deitel.com">

<p>
<label>
Color:
<input type="color" autofocus>
(Hexadecimal code such as #ADD8E6)
</label>
</p>

<p>
<label>
Date:
<input type="date">
(yyyy-mm-dd)
</label>
</p>

<p>
<label>
Email:
<input type="email" placeholder="name@domain.com">
(name@domain.com)
</label>
</p>

<p>
<label>
Number:
<input type="number" min="0" max="7" step="1">
(Enter a number between 0 and 7)
</label>
</p>

<p>
<label>
Range:
0
<input type="range" min="0" max="20" value="10">
20
</label>
</p>

<p>
<label>
Search:
<input type="search" placeholder="search query">
(Enter your search query here.)
</label>
</p>

<p>
<label>
URL:
<input type="url" placeholder="http://www.domainname.com">
(http://www.domainname.com)
</label>
</p>

<p>
<input type="submit" value="Submit">
<input type="reset" value="Clear">
</p>

</form>

</body>

</html>
